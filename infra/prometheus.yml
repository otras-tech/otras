global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'backend'
    scrape_interval: 5s
    static_configs:
      - targets: ['backend:4000']
    metrics_path: '/metrics'

  - job_name: 'ai-service'
    scrape_interval: 5s
    static_configs:
      - targets: ['ai-service:3001']
    metrics_path: '/metrics'
